name: Codex MCP Windows validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.codex/**'
      - '.github/workflows/mcp-sidecar.yml'
      - 'tools/vita3k-mcp/**'
      - 'CMakeLists.txt'
      - 'external/CMakeLists.txt'
      - 'vita3k/app/**'
      - 'vita3k/ctrl/**'
      - 'vita3k/gui-qt/**'
      - 'vita3k/interface.cpp'
      - 'vita3k/interface.h'
  pull_request:
    paths:
      - '.codex/**'
      - 'tools/vita3k-mcp/**'
      - 'CMakeLists.txt'
      - 'external/CMakeLists.txt'
      - 'vita3k/app/**'
      - 'vita3k/ctrl/**'
      - 'vita3k/gui-qt/**'
      - 'vita3k/interface.cpp'
      - 'vita3k/interface.h'

permissions:
  contents: read

concurrency:
  group: codex-mcp-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-local-toolchain:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      npm_config_cache: ${{ github.workspace }}\.tools\cache\npm
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Provision portable Node in the repository
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/vita3k-mcp/scripts/ensure-toolchain.ps1 -RepoRoot $env:GITHUB_WORKSPACE -Components Node
          (Join-Path $env:GITHUB_WORKSPACE '.tools\node') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install sidecar dependencies locally
        working-directory: tools/vita3k-mcp
        run: npm ci

      - name: Run TypeScript and fake-pipe integration tests
        working-directory: tools/vita3k-mcp
        run: npm test

      - name: Build Vita3K through the repository-local toolchain
        working-directory: tools/vita3k-mcp
        run: npm run ci:build

      - name: Verify generated executable
        shell: pwsh
        run: |
          $binary = Get-ChildItem -LiteralPath build/windows-vs2022 -Filter Vita3K.exe -File -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Vita3K.exe was not produced.' }
          Write-Host $binary.FullName
